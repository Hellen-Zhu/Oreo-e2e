<!DOCTYPE html>
<!-- The template of TestDataTool seed-report (SeedReport): the tool puts the report's data in place of the mark in the
     script element "seed-data" and writes the page to target/seed/seed-report-<run ID or all>.html, beside the CSV.
     Everything the page needs is in this file: it opens offline, with no server. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SIT seed report</title>
<style>
:root {
  --bg: #ffffff; --surface: #f6f7f9; --surface-2: #eceef2; --text: #1d2330; --text-2: #5b6474; --muted: #9aa1ad;
  --border: #e3e6eb; --border-strong: #c4c9d2; --accent: #2f5bd3; --accent-bg: #e9effc;
  --ok: #1f8a4c; --ok-bg: #e6f4ec; --bad: #c4352b; --bad-bg: #fbe9e7;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171c; --surface: #1c2027; --surface-2: #262b34; --text: #e6e9ee; --text-2: #a4acb9; --muted: #6c7482;
    --border: #2c323c; --border-strong: #454d5a; --accent: #7c9cf0; --accent-bg: #1f2a44;
    --ok: #4cc283; --ok-bg: #16301f; --bad: #f0776c; --bad-bg: #3a1d1a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14171c; --surface: #1c2027; --surface-2: #262b34; --text: #e6e9ee; --text-2: #a4acb9; --muted: #6c7482;
  --border: #2c323c; --border-strong: #454d5a; --accent: #7c9cf0; --accent-bg: #1f2a44;
  --ok: #4cc283; --ok-bg: #16301f; --bad: #f0776c; --bad-bg: #3a1d1a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { max-width: 1440px; margin: 0 auto; padding: 24px 24px 48px; }
h1 { font-size: 22px; font-weight: 600; margin: 0; }
h2 { font-size: 16px; font-weight: 600; margin: 32px 0 10px; }
.meta { color: var(--text-2); font-size: 13px; margin-top: 4px; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-top: 20px; }
.card { background: var(--surface); border-radius: 8px; padding: 12px 14px; }
.card .k { font-size: 12px; color: var(--text-2); }
.card .v { font-size: 24px; font-weight: 600; margin-top: 2px; }
.card .v.ok { color: var(--ok); }
.card .v.bad { color: var(--bad); }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; margin: 24px 0 12px; }
.toolbar input[type=search] { flex: 1 1 260px; max-width: 420px; padding: 7px 10px; font: inherit;
  color: var(--text); background: var(--bg); border: 1px solid var(--border-strong); border-radius: 7px; }
.seg { display: inline-flex; border: 1px solid var(--border-strong); border-radius: 7px; overflow: hidden; }
.seg button { background: var(--bg); border: 0; padding: 6px 12px; font: inherit; font-size: 13px;
  color: var(--text-2); cursor: pointer; }
.seg button + button { border-left: 1px solid var(--border-strong); }
.seg button[aria-pressed="true"] { background: var(--accent-bg); color: var(--accent); font-weight: 600; }
.btn { background: var(--bg); border: 1px solid var(--border-strong); border-radius: 7px; padding: 6px 12px;
  font: inherit; font-size: 13px; color: var(--text); cursor: pointer; }
.btn:hover { background: var(--surface); }
.count { color: var(--muted); font-size: 12px; }
.table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--border); white-space: nowrap;
  vertical-align: top; }
th { background: var(--surface); color: var(--text-2); font-weight: 600; font-size: 12px; position: sticky; top: 0;
  cursor: pointer; user-select: none; }
th[aria-sort="ascending"]::after { content: " ▲"; font-size: 9px; }
th[aria-sort="descending"]::after { content: " ▼"; font-size: 9px; }
tbody tr:hover td { background: var(--surface); }
tbody tr:last-child td { border-bottom: 0; }
.mono { font-family: var(--mono); font-size: 12px; }
.trade { font-family: var(--mono); font-size: 12px; font-weight: 600; }
.copy { margin-left: 6px; border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 12px;
  padding: 0 2px; }
.copy:hover { color: var(--accent); }
.pill { display: inline-block; padding: 0 8px; border-radius: 9px; font-size: 12px; font-weight: 500; }
.pill.booked { background: var(--ok-bg); color: var(--ok); }
.pill.failed { background: var(--bad-bg); color: var(--bad); }
.type { color: var(--text-2); }
.error td { white-space: normal; color: var(--bad); font-family: var(--mono); font-size: 12px;
  background: var(--bad-bg); }
.more { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 11px; padding: 0 6px 0 0;
  width: 16px; }
.more:hover, .more[aria-expanded="true"] { color: var(--accent); }
.payload > td { white-space: normal; background: var(--surface); padding: 10px 12px 12px 26px; }
.payload .blk { margin: 0 0 10px; }
.payload .blk:last-child { margin-bottom: 0; }
.payload .hd { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-2); font-weight: 600;
  margin-bottom: 4px; }
.payload .hd .copy { font-weight: 400; }
.payload pre { margin: 0; padding: 8px 10px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
  font-family: var(--mono); font-size: 12px; line-height: 1.5; max-height: 360px; overflow: auto;
  white-space: pre; }
.payload .none { color: var(--muted); font-size: 12px; }
.empty { padding: 28px; text-align: center; color: var(--muted); }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--text);
  color: var(--bg); padding: 7px 14px; border-radius: 7px; font-size: 13px; opacity: 0; transition: opacity .2s;
  pointer-events: none; }
.toast.on { opacity: 1; }
@media (max-width: 640px) { main { padding: 16px; } }
</style>
</head>
<body>
<main>
  <h1>SIT seed report</h1>
  <div class="meta" id="meta"></div>
  <div class="cards" id="cards"></div>

  <section id="trades"></section>
  <section id="events"></section>

</main>
<div class="toast" id="toast"></div>

<script type="application/json" id="seed-data">@@SEED_DATA@@</script>
<script>
(function () {
  const data = JSON.parse(document.getElementById('seed-data').textContent);
  const bookings = data.bookings || [];
  bookings.forEach((b, i) => { b._i = i; });
  // the rows whose payloads are shown: the request each booking sent, kept in the manifest
  const opened = new Set();
  const label = b => b.case || b.event || b.variant || '';
  const common = [
    { key: 'portfolioId', title: 'Portfolio' },
    { key: 'riskPortfolio', title: 'Risk portfolio' },
    { key: 'scbEntity', title: 'Entity' },
    { key: 'at', title: 'At' }
  ];
  // the run of each line, when the report merges several (all, a rerun over its first run)
  const run = new Set(bookings.map(b => b.run)).size > 1 ? [{ key: 'run', title: 'Run' }] : [];
  // new trades (kind "trade") and lifecycle events (kind "event", a step-in variant included), each in a section of its own
  const sections = [
    { id: 'trades', title: 'New trades', rows: bookings.filter(b => b.kind !== 'event'), columns: [
      { key: 'case', title: 'Case', get: label }, ...run, { key: 'tradeId', title: 'Trade ID' },
      { key: 'status', title: 'Status' }, { key: 'itradeableType', title: 'Itradeable Type' },
      { key: 'composition', title: 'Composition' }, { key: 'productId', title: 'Product ID' },
      { key: 'taxonomy', title: 'Taxonomy' }, { key: 'variant', title: 'Variant' }, ...common] },
    { id: 'events', title: 'Lifecycle events', rows: bookings.filter(b => b.kind === 'event'), columns: [
      { key: 'case', title: 'Case', get: label }, ...run, { key: 'event', title: 'Event', get: b => b.event || b.variant || '' },
      { key: 'tradeId', title: 'Trade ID' }, { key: 'status', title: 'Status' },
      { key: 'itradeableType', title: 'Itradeable Type' },
      { key: 'childTradeIds', title: 'Child trade IDs', get: b => (b.childTradeIds || []).join(' ') },
      { key: 'composition', title: 'Composition' }, { key: 'productId', title: 'Product ID' },
      { key: 'eventCase', title: 'E2E case' }, ...common] }
  ];
  const value = (b, c) => String((c.get ? c.get(b) : b[c.key]) ?? '');

  const envs = [...new Set(bookings.map(b => b.env).filter(Boolean))];
  document.getElementById('meta').textContent =
    (data.run === 'all' ? 'All runs (' + data.runs + ')' : 'Run ' + data.run.split('+').join(' + ') + ' (' + data.runs + ' run(s) kept)')
    + (envs.length ? ' · ' + envs.join(', ') : '') + ' · generated ' + data.generated;

  const booked = bookings.filter(b => b.status === 'booked').length;
  const failed = bookings.length - booked;
  const types = new Set(bookings.map(b => b.itradeableType).filter(Boolean)).size;
  const cardsOf = list => list.map(([k, v, cls]) => '<div class="card"><div class="k">' + k
    + '</div><div class="v ' + cls + '">' + v + '</div></div>').join('');
  document.getElementById('cards').innerHTML = cardsOf([
    ['Bookings', bookings.length, ''], ['Booked', booked, 'ok'], ['Failed', failed, failed ? 'bad' : ''],
    ['Itradeable Types', types, '']
  ]);

  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const shortType = t => t ? t.split('.').slice(-2).join('.') : '';

  function section(sec) {
    const root = document.getElementById(sec.id);
    const { rows: all, columns } = sec;
    const ok = all.filter(b => b.status === 'booked').length;
    root.innerHTML = '<h2>' + sec.title + ' <span class="count">' + ok + ' booked, ' + (all.length - ok)
      + ' failed</span></h2>'
      + '<div class="toolbar">'
      + '<input type="search" placeholder="Search case, trade ID, product, portfolio…" aria-label="Search '
      + sec.title + '">'
      + '<div class="seg" role="group" aria-label="Status">'
      + '<button data-v="" aria-pressed="true">All</button><button data-v="booked" aria-pressed="false">Booked</button>'
      + '<button data-v="failed" aria-pressed="false">Failed</button></div>'
      + '<button class="btn payloads" title="Show or hide the request each row sent">Show payloads</button>'
      + '<button class="btn copy-all" title="Case, trade ID and child trade IDs of the rows shown, tab-separated">Copy trade IDs</button>'
      + '<span class="count"></span></div>'
      + '<div class="table-wrap"><table><thead><tr></tr></thead><tbody></tbody></table></div>';
    const head = root.querySelector('thead tr'), body = root.querySelector('tbody'),
      count = root.querySelector('.toolbar .count');
    let status = '', query = '', sortKey = null, sortDir = 1;
    head.innerHTML = columns.map(c => '<th data-k="' + c.key + '">' + c.title + '</th>').join('');
    head.addEventListener('click', e => {
      const th = e.target.closest('th'); if (!th) return;
      sortDir = sortKey === th.dataset.k ? -sortDir : 1; sortKey = th.dataset.k;
      head.querySelectorAll('th').forEach(h => h.removeAttribute('aria-sort'));
      th.setAttribute('aria-sort', sortDir > 0 ? 'ascending' : 'descending');
      render();
    });

    function shown() {
      const q = query.toLowerCase();
      let out = all.filter(b => (!status || b.status === status)
        && (!q || columns.some(c => value(b, c).toLowerCase().includes(q)) || (b.error || '').toLowerCase().includes(q)));
      if (sortKey) {
        const c = columns.find(c => c.key === sortKey);
        out = out.slice().sort((a, b) => value(a, c).localeCompare(value(b, c), undefined, { numeric: true }) * sortDir);
      }
      return out;
    }

    function render() {
      const rows = shown();
      count.textContent = rows.length + ' of ' + all.length;
      body.innerHTML = rows.length ? rows.map(b =>
        '<tr>' + columns.map((c, i) => '<td>' + (i === 0 ? more(b) : '') + cell(b, c) + '</td>').join('') + '</tr>'
        + (opened.has(b._i) ? '<tr class="payload"><td colspan="' + columns.length + '">' + payload(b) + '</td></tr>' : '')
        + (b.status === 'failed' && b.error ? '<tr class="error"><td colspan="' + columns.length + '">'
          + esc(b.error) + '</td></tr>' : '')).join('')
        : '<tr><td class="empty" colspan="' + columns.length + '">'
          + (all.length ? 'No booking matches' : 'No ' + sec.title.toLowerCase() + ' in this run') + '</td></tr>';
    }

    root.querySelector('input[type=search]').addEventListener('input', e => { query = e.target.value; render(); });
    const seg = root.querySelector('.seg');
    seg.addEventListener('click', e => {
      const btn = e.target.closest('button'); if (!btn) return;
      status = btn.dataset.v;
      seg.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === btn)));
      render();
    });
    body.addEventListener('click', e => {
      const toggle = e.target.closest('.more');
      if (toggle) {
        const i = Number(toggle.dataset.i);
        if (!opened.delete(i)) opened.add(i);
        render();
        return;
      }
      const btn = e.target.closest('.copy');
      if (btn) copy(btn.dataset.copy, btn.dataset.what || 'Copied ' + btn.dataset.copy.split('\n').join(', '));
    });
    root.querySelector('.payloads').addEventListener('click', () => {
      const rows = shown();
      const allOpen = rows.length && rows.every(b => opened.has(b._i));
      rows.forEach(b => allOpen ? opened.delete(b._i) : opened.add(b._i));
      render();
    });
    root.querySelector('.copy-all').addEventListener('click', () => {
      const rows = shown().filter(b => b.tradeId);
      // an event's child trades follow its trade ID, tab-separated
      copy(rows.map(b => [label(b), b.tradeId, ...(b.childTradeIds || [])].join('\t')).join('\n'),
        'Copied ' + rows.length + ' trade ID(s)');
    });
    render();
  }

  function more(b) {
    const on = opened.has(b._i);
    return '<button class="more" data-i="' + b._i + '" aria-expanded="' + on + '" title="'
      + (on ? 'Hide' : 'Show') + ' the request it sent">' + (on ? '▾' : '▸') + '</button>';
  }

  // what a booking sent: the trade part of the create request and its dat file; for an event, the event's body
  function payload(b) {
    const blocks = [];
    if (b.dat) blocks.push('<div class="blk"><div class="hd">Dat file <span class="mono">' + esc(b.dat) + '</span>'
      + copyBtn(b.dat) + '</div></div>');
    [['request', 'Trade request'], ['eventRequest', b.event === 'amendment' ? 'Amendment request' : 'Event request']]
      .forEach(([key, title]) => {
        if (!b[key]) return;
        const json = JSON.stringify(b[key], null, 2);
        blocks.push('<div class="blk"><div class="hd">' + title + '<button class="copy" data-copy="' + esc(json)
          + '" data-what="Copied the ' + title.toLowerCase() + '" title="Copy the JSON">⧉ copy</button></div><pre>'
          + esc(json) + '</pre></div>');
      });
    return blocks.length ? blocks.join('')
      : '<div class="none">No request recorded: this line was written before the manifest kept what was sent.</div>';
  }

  // a copy button: by the trade IDs and by what a booking sent (dat path, request JSON), not by the other fields
  const copyBtn = v => '<button class="copy" data-copy="' + esc(v) + '" title="Copy ' + esc(v) + '">⧉</button>';

  function cell(b, c) {
    const v = value(b, c);
    if (c.key === 'tradeId') return v ? '<span class="trade">' + esc(v) + '</span>' + copyBtn(v) : '';
    if (c.key === 'childTradeIds') {
      const ids = b.childTradeIds || [];
      return ids.map(id => '<span class="trade">' + esc(id) + '</span>' + copyBtn(id)).join(' ')
        + (ids.length > 1 ? ' <button class="copy" data-copy="' + esc(ids.join('\n'))
          + '" title="Copy all child trade IDs">all</button>' : '');
    }
    if (c.key === 'status') return '<span class="pill ' + esc(v) + '">' + esc(v) + '</span>';
    if (c.key === 'itradeableType') return '<span class="type" title="' + esc(v) + '">' + esc(shortType(v)) + '</span>';
    if (['case', 'composition', 'productId', 'portfolioId', 'riskPortfolio', 'run', 'eventCase']
      .includes(c.key)) return '<span class="mono">' + esc(v) + '</span>';
    return esc(v);
  }

  const toast = document.getElementById('toast');
  function copy(text, what) {
    const done = () => { toast.textContent = what; toast.classList.add('on'); setTimeout(() => toast.classList.remove('on'), 1400); };
    if (navigator.clipboard) navigator.clipboard.writeText(text).then(done, () => fallback(text, done));
    else fallback(text, done);
  }
  function fallback(text, done) {
    const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select();
    try { document.execCommand('copy'); done(); } finally { t.remove(); }
  }
  sections.forEach(section);
})();
</script>
</body>
</html>
