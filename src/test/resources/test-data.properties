# Test data decisions kept out of the code, read by TestDataTool (ProjectPaths.settings).

# Setup files the code names but that do not exist yet: not covered for now, by the user's decision.
# TestDataTool check skips them. Change only on the user's decision.
check.knownMissingSetups=trade-cancellation,trade-amendment

# The most cases one feature file may run, per layer: Scenarios count 1, Outlines one per Examples row, @wip not at all.
# A feature is one fork's unit of work (forkMode FEATURE), so its length sets the run's tail. TestDataTool check warns
# above it; split by business behavior (docs/standards/bdd-feature-generation-standards.md, "Feature size").
check.maxCasesPerFeature.api=30
check.maxCasesPerFeature.ui=12
