# Settings of the test data library (com.example.oreo:oreo-test-data) that only this suite can give.
# The product registry is not here: it is ProductDatFiles, found through
# src/main/resources/META-INF/services/com.example.testdata.ProductRegistry.

# Setup files the code names but that do not exist yet, by the team's decision (TestDataTool check skips them).
# Change only on the user's decision.
check.knownMissingSetups=trade-cancellation,trade-amendment

# Java methods whose string arguments are setup names (a regular expression of method names): check makes sure each
# named data/setup/<name>.json exists.
check.setupNameCalls=provision\\w*|triggerEvent
